<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slug Converter</title>

<style>
:root {
  --bg: #0e0f13;
  --card: #16181f;
  --text: #e6e6eb;
  --muted: #9aa0aa;
  --accent: #6ae3ff;
  --accent-hover: #4fd3f3;
  --border: #242735;
}

* {
  box-sizing: border-box;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #141622, var(--bg));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

.card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.45);
}

h1 {
  font-size: 1.4rem;
  margin: 0 0 6px;
}

p {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 0.9rem;
}

label {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 6px;
  display: block;
}

input {
  width: 100%;
  padding: 14px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #0f111a;
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
}

input:focus {
  border-color: var(--accent);
}

.output {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 10px;
  background: #0b0d14;
  border: 1px dashed var(--border);
  font-size: 0.9rem;
  word-break: break-all;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  color: #001018;
  background: linear-gradient(135deg, var(--accent), #9af0ff);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(106,227,255,0.35);
}

.copied {
  text-align: center;
  margin-top: 10px;
  font-size: 0.8rem;
  color: var(--accent);
  opacity: 0;
  transition: opacity 0.25s ease;
}

.copied.show {
  opacity: 1;
}
</style>
</head>

<body>
  <div class="card">
    <h1>Slug Converter</h1>
    <p>Lowercase + spaces → dashes</p>

    <label for="input">Input text</label>
    <input id="input" type="text" placeholder="Type something here..." />

    <div class="output" id="output">—</div>

    <button id="copyBtn">Convert & Copy</button>
    <div class="copied" id="copiedText">Copied to clipboard ✓</div>
  </div>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
const copyBtn = document.getElementById("copyBtn");
const copiedText = document.getElementById("copiedText");

function convertText(value) {
  return value
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-");
}

input.addEventListener("input", () => {
  const converted = convertText(input.value);
  output.textContent = converted || "—";
});

copyBtn.addEventListener("click", async () => {
  const text = output.textContent;
  if (!text || text === "—") return;

  await navigator.clipboard.writeText(text);
  copiedText.classList.add("show");

  setTimeout(() => {
    copiedText.classList.remove("show");
  }, 1500);
});
</script>
</body>
</html>

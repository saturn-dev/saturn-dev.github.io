<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Discord Image Grabber</title>

<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel2:#1e222b;
    --accent:#7c5cff;
    --accent2:#9b87ff;
    --text:#e6e9ef;
    --muted:#8b93a7;
    --border:#2b3040;
  }

  body{
    margin:0;
    font-family: Inter, system-ui, sans-serif;
    background: radial-gradient(circle at top, #151824, #0b0d12);
    color:var(--text);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card{
    width:900px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }

  h1{
    margin:0 0 10px;
    font-size:28px;
    letter-spacing:.5px;
  }

  p{
    margin:0 0 18px;
    color:var(--muted);
  }

  textarea{
    width:100%;
    height:260px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    color:var(--text);
    font-size:14px;
    resize:vertical;
    outline:none;
    transition:.2s;
  }

  textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(124,92,255,.25);
  }

  .btn{
    margin-top:18px;
    width:100%;
    padding:16px;
    font-size:18px;
    font-weight:700;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    transition:.25s;
    box-shadow:0 10px 25px rgba(124,92,255,.35);
  }

  .btn:hover{
    transform:scale(1.04);
    box-shadow:0 15px 35px rgba(124,92,255,.5);
  }

  .output{
    margin-top:16px;
    padding:12px;
    background:var(--panel2);
    border-radius:10px;
    border:1px solid var(--border);
    font-size:13px;
    word-break:break-all;
    color:var(--muted);
  }
</style>
</head>

<body>

<div class="card">
  <h1>Discord Image Grabber</h1>
  <p>Paste Discord message HTML → extracts & copies all images.</p>

  <textarea id="input" placeholder="Paste HTML here..."></textarea>
  <button class="btn" onclick="grabImages()">Copy All Images</button>

  <div id="output" class="output">Output will appear here...</div>
</div>

<script>
function copyTextFallback(text) {
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.style.position = "fixed";
  textarea.style.opacity = 0;
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  document.execCommand("copy");
  document.body.removeChild(textarea);
}

async function copyToClipboard(text){
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    copyTextFallback(text);
  }
}

// decode &amp; &quot; etc
function decodeHTML(html){
  const txt = document.createElement("textarea");
  txt.innerHTML = html;
  return txt.value;
}
async function grabImages(){
  const rawText = document.getElementById("input").value;
  const outputBox = document.getElementById("output");

  if(!rawText.trim()){
    outputBox.textContent = "⚠️ Paste Discord HTML first.";
    return;
  }

  // Decode HTML entities (&amp; → &)
  const text = decodeHTML(rawText);

  // Grab preview links
  const regex = /https:\/\/media\.discordapp\.net\/attachments\/[^\s"]+/g;
  let matches = text.match(regex) || [];

  if(matches.length === 0){
    outputBox.textContent = "❌ No images found.";
    return;
  }

  // Convert preview → real CDN
  let fixedLinks = matches.map(url =>
    url.replace("media.discordapp.net", "cdn.discordapp.com")
  );

  // ⭐ REMOVE DUPLICATES (this is the fix)
  fixedLinks = [...new Set(fixedLinks)];

  const finalString = fixedLinks.join(",");

  await copyToClipboard(finalString);

  outputBox.textContent =
    `✅ ${fixedLinks.length} unique images copied!\n\n${finalString}`;
}

</script>



</body>
</html>
